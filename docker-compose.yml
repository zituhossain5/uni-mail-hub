services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unimailhub
      POSTGRES_USER: unimail
      POSTGRES_PASSWORD: unimail_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimail -d unimailhub"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
  redis_data:
