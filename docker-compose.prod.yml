name: uni-mail-hub

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-app-env: &app-env
  env_file: .env.production
  environment:
    NODE_ENV: production
    APP_VERSION: ${APP_VERSION:?Set immutable APP_VERSION}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
    SEED_ADMIN_PASSWORD: ''
    POSTGRES_PASSWORD: ''

services:
  reverse-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - type: bind
        source: ./deploy/nginx/uni-mail-hub.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${TLS_CERT_DIR:?Set TLS_CERT_DIR}
        target: /etc/nginx/tls
        read_only: true
    depends_on:
      web:
        condition: service_healthy
    networks: [front]
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t >/dev/null 2>&1 && pgrep nginx >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  web:
    image: uni-mail-hub-web:${APP_VERSION:?Set immutable APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: web
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?Set immutable APP_VERSION}
      WEB_URL: ${WEB_URL:?Set WEB_URL}
      UNI_MAIL_HUB_PUBLIC_URL: ${UNI_MAIL_HUB_PUBLIC_URL:?Set UNI_MAIL_HUB_PUBLIC_URL}
      API_URL: ${API_URL:?Set API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [front]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging

  api:
    image: uni-mail-hub-api:${APP_VERSION:?Set immutable APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api
      args:
        SERVICE: api
    <<: *app-env
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?Set immutable APP_VERSION}
      API_BIND_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      SEED_ADMIN_PASSWORD: ''
      POSTGRES_PASSWORD: ''
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging

  worker:
    image: uni-mail-hub-worker:${APP_VERSION:?Set immutable APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: worker
      args:
        SERVICE: worker
    <<: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [back, egress]
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/health.mjs']
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 60s
    stop_grace_period: 90s
    logging: *logging

  postgres:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [back]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [back]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  ops:
    profiles: [ops]
    image: uni-mail-hub-ops:${APP_VERSION:?Set immutable APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: ops
    <<: *app-env
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?Set immutable APP_VERSION}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
    volumes:
      - type: bind
        source: ${BACKUP_HOST_DIR:?Set BACKUP_HOST_DIR}
        target: /backups
      - type: bind
        source: ${TLS_CERT_DIR:?Set TLS_CERT_DIR}
        target: /etc/nginx/tls
        read_only: true
    networks: [front, back]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

networks:
  front:
  back:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
